plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.pcuploadserver'
version = '0.1.0'

android {
  namespace "expo.modules.pcuploadserver"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Встраиваемый HTTP-сервер для приёма файлов с ПК по локальной сети (LAN, без TLS — гейт по PIN).
  implementation 'org.nanohttpd:nanohttpd:2.3.1'
}
